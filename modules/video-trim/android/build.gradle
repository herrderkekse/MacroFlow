plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videotrim'
version = '0.1.0'

android {
  namespace "expo.modules.videotrim"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Re-encodes a video when it is cropped. Kept at expo-video's Media3 version,
  // so the app carries one Media3.
  def media3Version = "1.9.0"
  implementation "androidx.media3:media3-transformer:${media3Version}"
  implementation "androidx.media3:media3-effect:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
}
